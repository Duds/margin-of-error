<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 640" class="chart" role="img" aria-labelledby="chart-01-title chart-01-desc" data-source-id="roymorgan-pvi" font-family="IBM Plex Mono, ui-monospace, monospace" style="aspect-ratio: 1072 / 640; font-variant-numeric: tabular-nums">
<title id="chart-01-title">Polling against the result, One Nation primary vote, federal elections 2019 and 2022</title>
<desc id="chart-01-desc">A two-panel chart. The upper panel shows polling minus result in percentage points for 2 federal elections, drawn from a zero rule so the axis is centred on the quantity being measured. The lower panel shows, for each election, the span of polling values published in the preceding waves as a vertical bar, the mean of those waves, and the result marked as a horizontal rule. For 2019, polling averaged 3.70 per cent across the 5 waves before the election and the party recorded 3.1 per cent, so polling overstated it by 0.60 points. For 2022, polling averaged 3.71 per cent across the 12 waves before the election and the party recorded 5 per cent, so polling understated it by 1.29 points. Based on 48 fortnightly waves published between 2018 and 2022. No wave carries a published margin of error, sample size or publication date, so no uncertainty interval is drawn and none is imputed. The span is not a time series: these are fortnightly snapshots and nothing is claimed about the values between them.</desc>
<defs><pattern id="hatch-mo" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="currentColor" stroke-width="1" /></pattern><pattern id="hatch-mo-print" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.6" /></pattern><marker id="result-mark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-ink)" /></marker></defs>
