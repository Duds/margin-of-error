<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1072 560" class="chart" role="img" aria-labelledby="chart-02-title chart-02-desc" data-source-id="aec-hor-2025-fp-by-party aec-hor-2001-fp-by-party aec-hor-2025-party-rep aec-by-farrer-2026" font-family="IBM Plex Mono, ui-monospace, monospace" style="aspect-ratio: 1072 / 560; font-variant-numeric: tabular-nums">
<title id="chart-02-title">National primary vote and share of the House held, federal elections 2001 to 2025</title>
<desc id="chart-02-desc">A line chart over 9 Australian federal general elections from 2001 to 2025. The upper line is the party's national primary vote share. The lower line is its share of the House, which is zero at every one of these elections, so the hatched band between the two lines is the entire distance between vote share and seat share. In 2001 the party recorded 4.34 per cent of the primary vote and won 0 of 150 seats. In 2004 the party recorded 1.19 per cent of the primary vote and won 0 of 150 seats. In 2007 the party recorded 0.26 per cent of the primary vote and won 0 of 150 seats. In 2010 the party recorded 0.22 per cent of the primary vote and won 0 of 150 seats. In 2013 the party recorded 0.17 per cent of the primary vote and won 0 of 150 seats. In 2016 the party recorded 1.29 per cent of the primary vote and won 0 of 150 seats. In 2019 the party recorded 3.08 per cent of the primary vote and won 0 of 151 seats. In 2022 the party recorded 4.96 per cent of the primary vote and won 0 of 151 seats. In 2025 the party recorded 6.4 per cent of the primary vote and won 0 of 151 seats. The House returned 150 seats to 2016 and 151 from 2019, and each share is computed against the chamber size for its own election rather than a single figure. The shaded block marks 2004 to 2016, where the party contested far fewer divisions and the figures are not the same measure as the years either side. The party's only seat came at the Farrer by-election in 2026, which is not plotted: a by-election covers one division on its own electorate rather than the whole House.</desc>
