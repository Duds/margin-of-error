# Continuous integration for the page shell and chart pipeline.
#
# Two checks, both stdlib-only, no dependency install step:
#
#   build.py --check   the accessibility floor, one-h1, one-main,
#                      lang="en-AU", role="img"/<title>/<desc> on every
#                      chart, chart provenance, no zero-width band, no
#                      raw hex, no unfilled placeholder, no placeholder
#                      prose
#   unittest            chart geometry, and regression tests asserting the
#                      build's guard rails actually fire
#
# Deliberately no pip install. The stack was locked to stdlib only for
# this reason: the thing that guards the page's accuracy has no supply
# chain to go stale.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref. Keeps the
# status check current instead of reporting on a commit nobody cares
# about.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # setup-python rather than relying on the runner's default. The
      # generators use PEP 604 unions (str | None), so 3.10 is the floor,
      # and an unpinned runner is how a build starts failing for a reason
      # that has nothing to do with the code.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Tests run FIRST on purpose. Steps are sequential and a failed step
      # skips the rest, and `build.py --check` fails by design while task 0003
      # is open. When --check was the first step, that meant the gate's own red
      # result hid the test result: 144 tests existed and CI never ran any of
      # them. A known-red publication gate should not cost us the geometry
      # signal.
      - name: Test chart geometry and guard rails
        run: python3 -m unittest discover -s tests -v

      # Drift is checked inside --check rather than in its own step, for the
      # same reason. As a later step it could not run while the gate was red,
      # so it was a check that had never once executed. It also previously ran
      # `build.py` with no arguments, which overwrote index.html before
      # comparing it: that version reported "no drift" on a hand-edited file.
      #
      # --check compares the committed artefact against what the sources build,
      # marked as a draft when a gate is red, because the artefact under a red
      # gate IS the draft.
      - name: Validate the page and check the artefact is current
        run: python3 tools/build.py --check
