# Continuous integration for the page shell and chart pipeline.
#
# Two checks, both stdlib-only, no dependency install step:
#
#   build.py --check   the accessibility floor, one-h1, one-main,
#                      lang="en-AU", role="img"/<title>/<desc> on every
#                      chart, chart provenance, no zero-width band, no
#                      raw hex, no unfilled placeholder, no placeholder
#                      prose
#   unittest            chart geometry, and regression tests asserting the
#                      build's guard rails actually fire
#
# Deliberately no pip install. The stack was locked to stdlib only for
# this reason: the thing that guards the page's accuracy has no supply
# chain to go stale.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref. Keeps the
# status check current instead of reporting on a commit nobody cares
# about.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # setup-python rather than relying on the runner's default. The
      # generators use PEP 604 unions (str | None), so 3.10 is the floor,
      # and an unpinned runner is how a build starts failing for a reason
      # that has nothing to do with the code.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate the page
        run: python3 tools/build.py --check

      - name: Test chart geometry and guard rails
        run: python3 -m unittest discover -s tests -v

      # The generated page is committed. If it drifts from the template
      # plus the committed SVGs, then someone hand-edited the artefact,
      # which is exactly what the template/output separation forbids.
      #
      # This must run the build to a TEMPORARY file and diff against the
      # committed one. Writing over index.html first and diffing after
      # would always pass: the build overwrites whatever was there, so
      # the drift is destroyed before it is measured. That version of the
      # check was written, tested, and caught doing exactly this — it
      # reported no drift on a file that had been hand-edited.
      - name: Verify index.html matches its sources
        run: |
          cp index.html /tmp/index.committed.html
          python3 tools/build.py
          if ! diff -u /tmp/index.committed.html index.html; then
            echo "::error::index.html is out of date with src/index.template.html"
            echo "::error::Run 'python3 tools/build.py' and commit the result."
            exit 1
          fi
          echo "index.html is current."
